name: Build and Release GameBox Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build GameBox Docker Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t gamebox-arm64:${{ github.ref_name }} \
            -f Containerfile \
            --load .

      - name: Export and Compress Docker Image
        run: |
          docker save gamebox-arm64:${{ github.ref_name }} | gzip -9 > gamebox-arm64-${{ github.ref_name }}.tar.gz

      - name: Create GitHub Release and Upload Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "./gamebox-arm64-${{ github.ref_name }}.tar.gz" \
            --title "GameBox Release ${{ github.ref_name }}" \
            --generate-notes
