name: Build and Release Tarball

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t gamebox-arm64:${{ github.ref_name }} \
            -f Containerfile .

      - name: Export and Compress Docker Image
        run: |
          docker save gamebox-arm64:${{ github.ref_name }} | gzip -9 > gamebox-arm64-termux-x11-${{ github.ref_name }}.tar.gz

      - name: Create GitHub Release and Upload Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "./gamebox-arm64-termux-x11-${{ github.ref_name }}.tar.gz" \
            --title "GameBox Termux-X11 ${{ github.ref_name }}" \
            --generate-notes
