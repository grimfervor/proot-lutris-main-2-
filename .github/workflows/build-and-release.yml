name: Build, Store Tar in Repo, and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t gamebox-arm64:${{ github.ref_name }} \
            -f Containerfile .

      - name: Create Builds Directory
        run: mkdir -p builds

      - name: Export and Compress Docker Image Archive
        run: |
          docker save gamebox-arm64:${{ github.ref_name }} | gzip -9 > builds/gamebox-arm64-termux-x11-${{ github.ref_name }}.tar.gz

      - name: Commit Tarball Archive to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add builds/gamebox-arm64-termux-x11-${{ github.ref_name }}.tar.gz
          git commit -m "build: save image tarball for ${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref }}

      - name: Create GitHub Release and Upload Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "builds/gamebox-arm64-termux-x11-${{ github.ref_name }}.tar.gz" \
            --title "GameBox Termux-X11 ${{ github.ref_name }}" \
            --generate-notes
