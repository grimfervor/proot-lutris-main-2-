name: Build and Release Termux-X11 Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image with Buildx
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            -t ghcr.io/${{ github.repository }}:latest \
            -f Containerfile \
            --load .

      - name: Export and Compress Docker Image
        run: |
          docker save ghcr.io/${{ github.repository }}:${{ github.ref_name }} | gzip -9 > gamebox-arm64-termux-x11-${{ github.ref_name }}.tar.gz

      - name: Create GitHub Release and Upload Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "./gamebox-arm64-termux-x11-${{ github.ref_name }}.tar.gz" \
            --title "GameBox Termux-X11 ${{ github.ref_name }}" \
            --generate-notes
